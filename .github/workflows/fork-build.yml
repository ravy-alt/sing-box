# Core build jobs and matrix are derived from the upstream build.yml.
# Keep all 44 core variants and the fork-artifacts.txt inventory in sync when updating upstream.
name: Fork build
'on':
  push:
    branches:
    - feat/subscription
  workflow_dispatch:
    inputs:
      version:
        description: Optional version, e.g. 1.14.4-subscription.1 (blank generates a unique version)
        type: string
        required: false
      publish:
        description: Publish all verified core packages as a prerelease
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  calculate_version:
    name: Prepare version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      apk_version: ${{ steps.version.outputs.apk_version }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Calculate fork version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "$INPUT_VERSION" ]]; then
          version="${INPUT_VERSION#v}"
        else
          base="$(git describe --tags --match 'v[0-9]*' --abbrev=0)"
          base="${base#v}"
          base="${base%%-subscription*}"
          version="${base}-subscription.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:8}"
        fi
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-subscription[.-][0-9A-Za-z.-]+$ ]]; then
          echo "Version must use a numeric base and a subscription prerelease suffix" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "apk_version=${version%%-subscription*}_git${GITHUB_RUN_NUMBER}-r0" >> "$GITHUB_OUTPUT"
        echo "Building sing-box $version"
  test:
    name: Subscription regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.26.10
        cache-dependency-path: '**/go.sum'
    - name: Run race tests
      env:
        GOTOOLCHAIN: local
      run: .github/test-subscription.sh
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }} ${{ matrix.variant }} ${{ matrix.goarm }}${{ matrix.go386 }}${{
      matrix.gomips }}${{ matrix.legacy_name }}
    runs-on: ubuntu-26.04
    needs:
    - calculate_version
    - test
    strategy:
      max-parallel: 13
      matrix:
        include:
        - os: linux
          arch: amd64
          variant: purego
          naive: true
        - os: linux
          arch: amd64
          variant: glibc
          naive: true
        - os: linux
          arch: amd64
          variant: musl
          naive: true
          debian: amd64
          rpm: x86_64
          pacman: x86_64
          alpine: x86_64
          openwrt: x86_64
        - os: linux
          arch: arm64
          variant: purego
          naive: true
        - os: linux
          arch: arm64
          variant: glibc
          naive: true
        - os: linux
          arch: arm64
          variant: musl
          naive: true
          debian: arm64
          rpm: aarch64
          pacman: aarch64
          alpine: aarch64
          openwrt: aarch64_cortex-a53 aarch64_cortex-a72 aarch64_cortex-a76 aarch64_generic
        - os: linux
          arch: '386'
          go386: sse2
        - os: linux
          arch: '386'
          variant: glibc
          naive: true
          go386: sse2
        - os: linux
          arch: '386'
          variant: musl
          naive: true
          go386: sse2
          debian: i386
          rpm: i386
          alpine: x86
          openwrt: i386_pentium4
        - os: linux
          arch: arm
          goarm: '7'
        - os: linux
          arch: arm
          variant: glibc
          naive: true
          goarm: '7'
        - os: linux
          arch: arm
          variant: musl
          naive: true
          goarm: '7'
          debian: armhf
          rpm: armv7hl
          pacman: armv7hl
          alpine: armv7
          openwrt: arm_cortex-a5_vfpv4 arm_cortex-a7_neon-vfpv4 arm_cortex-a7_vfpv4 arm_cortex-a8_vfpv3 arm_cortex-a9_neon
            arm_cortex-a9_vfpv3-d16 arm_cortex-a15_neon-vfpv4
        - os: linux
          arch: mipsle
          gomips: hardfloat
          naive: true
          variant: glibc
        - os: linux
          arch: mipsle
          gomips: softfloat
          naive: true
          variant: musl
          debian: mipsel
          rpm: mipsel
          openwrt: mipsel_24kc mipsel_74kc mipsel_mips32
        - os: linux
          arch: mips64le
          gomips: hardfloat
          naive: true
          variant: glibc
          debian: mips64el
          rpm: mips64el
        - os: linux
          arch: riscv64
          naive: true
          variant: glibc
        - os: linux
          arch: riscv64
          naive: true
          variant: musl
          debian: riscv64
          rpm: riscv64
          alpine: riscv64
          openwrt: riscv64_generic
        - os: linux
          arch: loong64
          naive: true
          variant: glibc
        - os: linux
          arch: loong64
          naive: true
          variant: musl
          debian: loongarch64
          rpm: loongarch64
          alpine: loongarch64
          openwrt: loongarch64_generic
        - os: linux
          arch: '386'
          go386: softfloat
          openwrt: i386_pentium-mmx
        - os: linux
          arch: arm
          goarm: '5'
          openwrt: arm_arm926ej-s arm_cortex-a7 arm_cortex-a9 arm_fa526 arm_xscale
        - os: linux
          arch: arm
          goarm: '6'
          debian: armel
          rpm: armv6hl
          openwrt: arm_arm1176jzf-s_vfp
        - os: linux
          arch: mips
          gomips: softfloat
          openwrt: mips_24kc mips_4kec mips_mips32
        - os: linux
          arch: mipsle
          gomips: hardfloat
          openwrt: mipsel_24kc_24kf
        - os: linux
          arch: mipsle
          gomips: softfloat
        - os: linux
          arch: mips64
          gomips: softfloat
          openwrt: mips64_mips64r2 mips64_octeonplus
        - os: linux
          arch: mips64le
          gomips: hardfloat
        - os: linux
          arch: mips64le
          gomips: softfloat
          openwrt: mips64el_mips64r2
        - os: linux
          arch: s390x
          debian: s390x
          rpm: s390x
        - os: linux
          arch: ppc64le
          debian: ppc64el
          rpm: ppc64le
        - os: linux
          arch: riscv64
        - os: linux
          arch: loong64
        - os: windows
          arch: amd64
          legacy_win7: true
          legacy_name: windows-7
        - os: windows
          arch: '386'
          legacy_win7: true
          legacy_name: windows-7
        - os: android
          arch: arm64
          ndk: aarch64-linux-android23
        - os: android
          arch: arm
          ndk: armv7a-linux-androideabi23
        - os: android
          arch: amd64
          ndk: x86_64-linux-android23
        - os: android
          arch: '386'
          ndk: i686-linux-android23
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Setup Go
      if: ${{ ! matrix.legacy_win7 }}
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.26.10
        cache: false
    - name: Cache Go modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/go/pkg/mod
        key: go-mod-linux-${{ hashFiles('go.sum') }}
        restore-keys: go-mod-linux-
    - name: Cache Go for Windows 7
      if: matrix.legacy_win7
      id: cache-go-for-windows7
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          ~/go/go_win7
        key: go_win7_12610
    - name: Setup Go for Windows 7
      if: matrix.legacy_win7 && steps.cache-go-for-windows7.outputs.cache-hit != 'true'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: .github/setup_go_for_windows7.sh
    - name: Setup Go for Windows 7
      if: matrix.legacy_win7
      run: |-
        echo "PATH=$HOME/go/go_win7/bin:$PATH" >> $GITHUB_ENV
        echo "GOROOT=$HOME/go/go_win7" >> $GITHUB_ENV
    - name: Setup Android NDK
      if: matrix.os == 'android'
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r28
    - name: Clone cronet-go
      if: matrix.naive && matrix.variant != 'purego'
      run: |
        set -xeuo pipefail
        CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
        git init ~/cronet-go
        git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
        git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
        git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
        git -C ~/cronet-go checkout FETCH_HEAD
        git -C ~/cronet-go submodule update --init --recursive --depth=1
    - name: Regenerate Debian keyring
      if: matrix.naive && matrix.variant != 'purego'
      run: |
        set -xeuo pipefail
        rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
        cd ~/cronet-go
        GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
    - name: Download Chromium toolchain
      if: matrix.naive && matrix.variant != 'purego'
      run: |
        set -xeuo pipefail
        cd ~/cronet-go
        if [[ "${{ matrix.variant }}" == "musl" ]]; then
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
        else
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} download-toolchain
        fi
    - name: Set Chromium toolchain environment
      if: matrix.naive && matrix.variant != 'purego'
      run: |
        set -xeuo pipefail
        cd ~/cronet-go
        if [[ "${{ matrix.variant }}" == "musl" ]]; then
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env >> $GITHUB_ENV
        else
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} env >> $GITHUB_ENV
        fi
    - name: Set tag
      run: git tag "v${{ needs.calculate_version.outputs.version }}"
    - name: Set build tags
      run: |
        set -xeuo pipefail
        if [[ "${{ matrix.naive }}" == "true" ]]; then
          TAGS=$(cat release/DEFAULT_BUILD_TAGS)
        elif [[ "${{ matrix.legacy_win7 }}" == "true" ]]; then
          TAGS=$(sed 's/,with_usbip//' release/DEFAULT_BUILD_TAGS_OTHERS)
        else
          TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
        fi
        if [[ "${{ matrix.variant }}" == "purego" ]]; then
          TAGS="${TAGS},with_purego"
        elif [[ "${{ matrix.variant }}" == "musl" ]]; then
          TAGS="${TAGS},with_musl"
        fi
        echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"
    - name: Set shared ldflags
      run: |
        echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"
    - name: Build (purego)
      if: matrix.variant == 'purego'
      run: |
        set -xeuo pipefail
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '0'
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        GO386: ${{ matrix.go386 }}
        GOARM: ${{ matrix.goarm }}
        GOMIPS: ${{ matrix.gomips }}
        GOMIPS64: ${{ matrix.gomips }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract libcronet.so
      if: matrix.variant == 'purego' && matrix.naive
      run: |
        set -xeuo pipefail
        CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
        LIBRARY_PATH="lib/${{ matrix.os }}_${{ matrix.arch }}/libcronet.so"
        git init "$RUNNER_TEMP/cronet-go-lib"
        git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
        git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
        git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
        git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
        cp "$RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" dist/
    - name: Build (glibc)
      if: matrix.variant == 'glibc'
      run: |
        set -xeuo pipefail
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '1'
        GOOS: linux
        GOARCH: ${{ matrix.arch }}
        GO386: ${{ matrix.go386 }}
        GOARM: ${{ matrix.goarm }}
        GOMIPS: ${{ matrix.gomips }}
        GOMIPS64: ${{ matrix.gomips }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build (musl)
      if: matrix.variant == 'musl'
      run: |
        set -xeuo pipefail
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '1'
        GOOS: linux
        GOARCH: ${{ matrix.arch }}
        GO386: ${{ matrix.go386 }}
        GOARM: ${{ matrix.goarm }}
        GOMIPS: ${{ matrix.gomips }}
        GOMIPS64: ${{ matrix.gomips }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build (non-variant)
      if: matrix.os != 'android' && matrix.variant == ''
      run: |
        set -xeuo pipefail
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '0'
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        GO386: ${{ matrix.go386 }}
        GOARM: ${{ matrix.goarm }}
        GOMIPS: ${{ matrix.gomips }}
        GOMIPS64: ${{ matrix.gomips }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Android
      if: matrix.os == 'android'
      run: |
        set -xeuo pipefail
        go install -v ./cmd/internal/build
        export CC='${{ matrix.ndk }}-clang'
        export CXX="${CC}++"
        mkdir -p dist
        GOOS=$BUILD_GOOS GOARCH=$BUILD_GOARCH build go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '1'
        BUILD_GOOS: ${{ matrix.os }}
        BUILD_GOARCH: ${{ matrix.arch }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Set name
      run: |-
        DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
        if [[ -n "${{ matrix.goarm }}" ]]; then
          DIR_NAME="${DIR_NAME}v${{ matrix.goarm }}"
        elif [[ -n "${{ matrix.go386 }}" && "${{ matrix.go386 }}" != 'sse2' ]]; then
          DIR_NAME="${DIR_NAME}-${{ matrix.go386 }}"
        elif [[ -n "${{ matrix.gomips }}" && "${{ matrix.gomips }}" != 'hardfloat' ]]; then
          DIR_NAME="${DIR_NAME}-${{ matrix.gomips }}"
        elif [[ -n "${{ matrix.legacy_name }}" ]]; then
          DIR_NAME="${DIR_NAME}-legacy-${{ matrix.legacy_name }}"
        fi
        if [[ "${{ matrix.variant }}" == "glibc" ]]; then
          DIR_NAME="${DIR_NAME}-glibc"
        elif [[ "${{ matrix.variant }}" == "musl" ]]; then
          DIR_NAME="${DIR_NAME}-musl"
        fi
        echo "DIR_NAME=${DIR_NAME}" >> "${GITHUB_ENV}"
        PKG_VERSION="${{ needs.calculate_version.outputs.version }}"
        PKG_VERSION="${PKG_VERSION//-/\~}"
        echo "PKG_VERSION=${PKG_VERSION}" >> "${GITHUB_ENV}"
    - name: Package DEB
      if: matrix.debian != ''
      run: |
        set -xeuo pipefail
        sudo gem install fpm
        sudo apt-get install -y debsigs
        cp .fpm_systemd .fpm
        fpm -t deb \
          -v "$PKG_VERSION" \
          -p "dist/sing-box_${{ needs.calculate_version.outputs.version }}_${{ matrix.os }}_${{ matrix.debian }}.deb" \
          --architecture ${{ matrix.debian }} \
          dist/sing-box=/usr/bin/sing-box
    - name: Package RPM
      if: matrix.rpm != ''
      run: |
        set -xeuo pipefail
        sudo gem install fpm
        echo '%_rpmformat 4' > "$HOME/.rpmmacros"
        cp .fpm_systemd .fpm
        fpm -t rpm \
          -v "$PKG_VERSION" \
          -p "dist/sing-box_${{ needs.calculate_version.outputs.version }}_${{ matrix.os }}_${{ matrix.rpm }}.rpm" \
          --architecture ${{ matrix.rpm }} \
          dist/sing-box=/usr/bin/sing-box
    - name: Sign packages when configured
      if: matrix.debian != '' || matrix.rpm != ''
      env:
        GPG_KEY: ${{ secrets.GPG_KEY }}
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "$GPG_KEY" && -z "$GPG_KEY_ID" ]]; then
          echo "No fork signing key configured; DEB/RPM packages are unsigned."
          exit 0
        fi
        if [[ -z "$GPG_KEY" || -z "$GPG_KEY_ID" ]]; then
          echo "GPG_KEY and GPG_KEY_ID must both be configured" >&2
          exit 1
        fi
        export GNUPGHOME="$RUNNER_TEMP/fork-package-signing"
        mkdir -m 700 "$GNUPGHOME"
        SB_SIGNING_PASSWORD_FILE="$RUNNER_TEMP/fork-package-signing-passphrase"
        trap 'rm -rf "$GNUPGHOME"; rm -f "$SB_SIGNING_PASSWORD_FILE"' EXIT
        printf '%s' "$GPG_PASSPHRASE" > "$SB_SIGNING_PASSWORD_FILE"
        chmod 600 "$SB_SIGNING_PASSWORD_FILE"
        printf '%s' "$GPG_KEY" | gpg --batch --pinentry-mode loopback --passphrase-file "$SB_SIGNING_PASSWORD_FILE" --import
        shopt -s nullglob
        for package in dist/*.deb; do
          debsigs --sign=origin -k "$GPG_KEY_ID" --gpgopts "--batch --pinentry-mode loopback --passphrase-file $SB_SIGNING_PASSWORD_FILE" "$package"
        done
        for package in dist/*.rpm; do
          rpmsign --define "_gpg_name $GPG_KEY_ID" --define "_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file $SB_SIGNING_PASSWORD_FILE" --addsign "$package"
        done
    - name: Package Pacman
      if: matrix.pacman != ''
      run: |-
        set -xeuo pipefail
        sudo gem install fpm
        sudo apt-get update || true
        sudo apt-get install -y libarchive-tools
        cp .fpm_pacman .fpm
        fpm -t pacman \
          -v "$PKG_VERSION" \
          -p "dist/sing-box_${{ needs.calculate_version.outputs.version }}_${{ matrix.os }}_${{ matrix.pacman }}.pkg.tar.zst" \
          --architecture ${{ matrix.pacman }} \
          dist/sing-box=/usr/bin/sing-box
    - name: Package OpenWrt
      if: matrix.openwrt != ''
      run: |-
        set -xeuo pipefail
        sudo gem install fpm
        cp .fpm_openwrt .fpm
        fpm -t deb \
          -v "$PKG_VERSION" \
          -p "dist/openwrt.deb" \
          --architecture all \
          dist/sing-box=/usr/bin/sing-box
        for architecture in ${{ matrix.openwrt }}; do
          .github/deb2ipk.sh "$architecture" "dist/openwrt.deb" "dist/sing-box_${{ needs.calculate_version.outputs.version }}_openwrt_${architecture}.ipk"
        done
        rm "dist/openwrt.deb"
    - name: Install apk-tools
      if: matrix.openwrt != '' || matrix.alpine != ''
      run: docker run --rm -v /usr/local/bin:/mnt alpine:edge sh -c "apk add --no-cache apk-tools-static && cp /sbin/apk.static
        /mnt/apk && chmod +x /mnt/apk"
    - name: Package OpenWrt APK
      if: matrix.openwrt != ''
      env:
        APK_VERSION_OVERRIDE: ${{ needs.calculate_version.outputs.apk_version }}
      run: |-
        set -xeuo pipefail
        for architecture in ${{ matrix.openwrt }}; do
          .github/build_openwrt_apk.sh \
            "$architecture" \
            "${{ needs.calculate_version.outputs.version }}" \
            "dist/sing-box" \
            "dist/sing-box_${{ needs.calculate_version.outputs.version }}_openwrt_${architecture}.apk"
        done
    - name: Package Alpine APK
      if: matrix.alpine != ''
      env:
        APK_VERSION_OVERRIDE: ${{ needs.calculate_version.outputs.apk_version }}
      run: |-
        set -xeuo pipefail
        .github/build_alpine_apk.sh \
          "${{ matrix.alpine }}" \
          "${{ needs.calculate_version.outputs.version }}" \
          "dist/sing-box" \
          "dist/sing-box_${{ needs.calculate_version.outputs.version }}_linux_${{ matrix.alpine }}.apk"
    - name: Archive
      run: |
        set -xeuo pipefail
        cd dist
        mkdir -p "${DIR_NAME}"
        cp ../LICENSE "${DIR_NAME}"
        if [ '${{ matrix.os }}' = 'windows' ]; then
          cp sing-box "${DIR_NAME}/sing-box.exe"
          zip -r "${DIR_NAME}.zip" "${DIR_NAME}"
        else
          cp sing-box "${DIR_NAME}"
          if [ -f libcronet.so ]; then
            cp libcronet.so "${DIR_NAME}"
          fi
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
        fi
        rm -r "${DIR_NAME}"
    - name: Cleanup
      run: rm -f dist/sing-box dist/libcronet.so
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: binary-${{ matrix.os }}_${{ matrix.arch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}${{ matrix.go386
          && format('_{0}', matrix.go386) }}${{ matrix.gomips && format('_{0}', matrix.gomips) }}${{ matrix.legacy_name
          && format('-legacy-{0}', matrix.legacy_name) }}${{ matrix.variant && format('-{0}', matrix.variant) }}
        path: dist
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    timeout-minutes: 90
  build_darwin:
    name: Build Darwin binaries
    runs-on: macos-latest
    needs:
    - calculate_version
    - test
    strategy:
      matrix:
        include:
        - arch: amd64
        - arch: arm64
        - arch: amd64
          legacy_osx: true
          legacy_name: macos-10.13
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Setup Go
      if: ${{ ! matrix.legacy_osx }}
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.26.10
        cache: false
    - name: Cache Go modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/go/pkg/mod
        key: go-mod-macos-${{ hashFiles('go.sum') }}
        restore-keys: go-mod-macos-
    - name: Cache Go for macOS 10.13
      if: matrix.legacy_osx
      id: cache-go-for-macos1013
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          ~/go/go_osx
        key: go_osx_12610
    - name: Setup Go for macOS 10.13
      if: matrix.legacy_osx && steps.cache-go-for-macos1013.outputs.cache-hit != 'true'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: .github/setup_go_for_macos1013.sh
    - name: Setup Go for macOS 10.13
      if: matrix.legacy_osx
      run: |-
        echo "PATH=$HOME/go/go_osx/bin:$PATH" >> $GITHUB_ENV
        echo "GOROOT=$HOME/go/go_osx" >> $GITHUB_ENV
    - name: Set tag
      run: git tag "v${{ needs.calculate_version.outputs.version }}"
    - name: Set build tags
      run: |
        set -xeuo pipefail
        if [[ "${{ matrix.legacy_osx }}" != "true" ]]; then
          TAGS=$(cat release/DEFAULT_BUILD_TAGS)
        else
          TAGS=$(sed 's/,with_usbip//' release/DEFAULT_BUILD_TAGS_OTHERS)
        fi
        echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"
    - name: Set shared ldflags
      run: |
        echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"
    - name: Build
      run: |
        set -xeuo pipefail
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
        ./cmd/sing-box
      env:
        CGO_ENABLED: '1'
        GOOS: darwin
        GOARCH: ${{ matrix.arch }}
        MACOSX_DEPLOYMENT_TARGET: ${{ matrix.legacy_osx && '10.13' || '' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Set name
      run: |-
        DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-darwin-${{ matrix.arch }}"
        if [[ -n "${{ matrix.legacy_name }}" ]]; then
          DIR_NAME="${DIR_NAME}-legacy-${{ matrix.legacy_name }}"
        fi
        echo "DIR_NAME=${DIR_NAME}" >> "${GITHUB_ENV}"
    - name: Archive
      run: |
        set -xeuo pipefail
        cd dist
        mkdir -p "${DIR_NAME}"
        cp ../LICENSE "${DIR_NAME}"
        cp sing-box "${DIR_NAME}"
        tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
        rm -r "${DIR_NAME}"
    - name: Cleanup
      run: rm dist/sing-box
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: binary-darwin_${{ matrix.arch }}${{ matrix.legacy_name && format('-legacy-{0}', matrix.legacy_name)
          }}
        path: dist
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    timeout-minutes: 90
  build_windows:
    name: Build Windows binaries
    runs-on: windows-latest
    needs:
    - calculate_version
    - test
    strategy:
      matrix:
        include:
        - arch: amd64
          naive: true
        - arch: '386'
        - arch: arm64
          naive: true
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.26.10
        cache: false
    - name: Patch Go for Windows ARM64
      if: matrix.arch == 'arm64'
      shell: bash
      run: .github/patch_go_for_windows_arm64.sh
    - name: Cache Go modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/go/pkg/mod
        key: go-mod-windows-${{ hashFiles('go.sum') }}
        restore-keys: go-mod-windows-
    - name: Set tag
      run: git tag "v${{ needs.calculate_version.outputs.version }}"
    - name: Build
      if: matrix.naive
      run: |
        $TAGS = Get-Content release/DEFAULT_BUILD_TAGS_WINDOWS
        $LDFLAGS_SHARED = Get-Content release/LDFLAGS
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box.exe -tags "$TAGS" `
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' $LDFLAGS_SHARED -s -w -buildid=" `
        ./cmd/sing-box
      env:
        CGO_ENABLED: '0'
        GOOS: windows
        GOARCH: ${{ matrix.arch }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build
      if: ${{ !matrix.naive }}
      run: |
        $TAGS = Get-Content release/DEFAULT_BUILD_TAGS_OTHERS
        $LDFLAGS_SHARED = Get-Content release/LDFLAGS
        mkdir -p dist
        go build -v -trimpath -o dist/sing-box.exe -tags "$TAGS" `
        -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' $LDFLAGS_SHARED -s -w -buildid=" `
        ./cmd/sing-box
      env:
        CGO_ENABLED: '0'
        GOOS: windows
        GOARCH: ${{ matrix.arch }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract libcronet.dll
      if: matrix.naive
      run: |
        $CRONET_GO_VERSION = Get-Content .github/CRONET_GO_VERSION
        $LIBRARY_PATH = "lib/windows_${{ matrix.arch }}/libcronet.dll"
        git init "$env:RUNNER_TEMP/cronet-go-lib"
        git -C "$env:RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
        git -C "$env:RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
        git -C "$env:RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
        git -C "$env:RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
        Copy-Item "$env:RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" dist
    - name: Archive
      if: matrix.naive
      run: |
        $DIR_NAME = "sing-box-${{ needs.calculate_version.outputs.version }}-windows-${{ matrix.arch }}"
        mkdir "dist/$DIR_NAME"
        Copy-Item LICENSE "dist/$DIR_NAME"
        Copy-Item "dist/sing-box.exe" "dist/$DIR_NAME"
        Copy-Item "dist/libcronet.dll" "dist/$DIR_NAME"
        Compress-Archive -Path "dist/$DIR_NAME" -DestinationPath "dist/$DIR_NAME.zip"
        Remove-Item -Recurse "dist/$DIR_NAME"
    - name: Archive
      if: ${{ !matrix.naive }}
      run: |
        $DIR_NAME = "sing-box-${{ needs.calculate_version.outputs.version }}-windows-${{ matrix.arch }}"
        mkdir "dist/$DIR_NAME"
        Copy-Item LICENSE "dist/$DIR_NAME"
        Copy-Item "dist/sing-box.exe" "dist/$DIR_NAME"
        Compress-Archive -Path "dist/$DIR_NAME" -DestinationPath "dist/$DIR_NAME.zip"
        Remove-Item -Recurse "dist/$DIR_NAME"
    - name: Cleanup
      if: matrix.naive
      run: Remove-Item dist/sing-box.exe, dist/libcronet.dll
    - name: Cleanup
      if: ${{ !matrix.naive }}
      run: Remove-Item dist/sing-box.exe
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: binary-windows_${{ matrix.arch }}
        path: dist
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    timeout-minutes: 90
  verify:
    name: Verify complete upstream artifact set
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - calculate_version
    - build
    - build_darwin
    - build_windows
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Download core packages
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        pattern: binary-*
        path: dist
        merge-multiple: true
    - name: Verify all upstream packages
      env:
        SB_VERSION: ${{ needs.calculate_version.outputs.version }}
      run: python3 .github/verify-fork-artifacts.py dist "$SB_VERSION"
    - name: Upload checksums
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: checksums
        path: dist/SHA256SUMS
        if-no-files-found: error
        retention-days: 7
  publish:
    name: Publish prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs:
    - calculate_version
    - verify
    permissions:
      contents: write
    steps:
    - name: Download core packages
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        pattern: binary-*
        path: dist
        merge-multiple: true
    - name: Download checksums
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: checksums
        path: dist
    - name: Verify checksums
      working-directory: dist
      run: sha256sum --check --quiet SHA256SUMS
    - name: Create fork release
      env:
        GH_TOKEN: ${{ github.token }}
        SB_VERSION: ${{ needs.calculate_version.outputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' "Built from $GITHUB_SHA." \
          "Core platforms, architectures, features and package formats match the upstream v1.14.4 inventory." \
          "DEB/RPM packages use the fork signing key when configured; official signatures are not inherited." \
          > "$RUNNER_TEMP/release-notes.txt"
        gh release create "v$SB_VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "sing-box $SB_VERSION" --notes-file "$RUNNER_TEMP/release-notes.txt" --prerelease
